[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "easytouch"
version = "0.1.0"
description = "Lightweight Python toolkit to monitor and control a Pentair EasyTouch pool controller over RS-485"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "ted" }]
keywords = ["pentair", "easytouch", "intellitouch", "pool", "rs485", "serial"]
dependencies = ["pyserial>=3.5"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
easytouch = "easytouch.cli:main"

[project.urls]
"Protocol reference" = "https://github.com/michaelusner/pentair-pool-controler"

[tool.setuptools]
packages = ["easytouch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
